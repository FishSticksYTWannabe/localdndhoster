[package]
name = "localdndhoster-server"
version = "0.1.0"
edition = "2021"
authors = ["localdndhoster"]

[dependencies]
anyhow = "1.0"
tokio = { version = "1.42", features = ["full"] }
tokio-tungstenite = "0.20"
tungstenite = "0.22"
futures-util = "0.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt"] }
